# Model runtime and Hugging Face download configuration.
#
# Keys match the GGUF filename after lowercasing and stripping
# `-q4_k_m.gguf` or `.q4_k_m.gguf`.
#
# Host RAM profiles (container memory is a cap, not a reservation):
#   small  — ~8GB host  (default): 1 slot
#   medium — ~16GB host: more parallel slots
#   large  — ~32GB host: more slots; context may rise toward native
#
# context_window is capped at native_context. Extra RAM is spent on
# `parallel` (-np), not on stretching past the model's trained length.
# start-llama-server.sh passes --kv-unified when parallel > 1 so -c is
# not sliced into c/np per slot.

models:
  # Group 1: small GQA (1–1.5B)
  llama-3.2-1b-instruct:
    filename: Llama-3.2-1B-Instruct-Q4_K_M.gguf
    repo: bartowski/Llama-3.2-1B-Instruct-GGUF
    native_context: 131072
    profiles:
      small:
        cpus: 4
        memory: "5.5g"
        context_window: 65536
        parallel: 1
      medium:
        cpus: 8
        memory: "12g"
        context_window: 65536
        parallel: 4
      large:
        cpus: 12
        memory: "24g"
        context_window: 131072
        parallel: 8
  deepseek-r1-distill-qwen-1.5b:
